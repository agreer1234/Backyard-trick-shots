name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Playwright is only used by the local playtest scripts; CI has no need
      # for a 300 MB browser download on every run.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` typechecks first, so a type error fails the deploy.
      - run: npm run build

      # Reads the repo's existing Pages config. This requires Pages to have
      # been switched on once, by hand, at
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The workflow token cannot enable Pages on a repo where it has never
      # been configured, so that first toggle is unavoidably manual.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
